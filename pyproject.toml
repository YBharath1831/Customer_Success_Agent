[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--strict-config",
    "--strict-markers",
    "-ra",
]
markers = [
    "integration: tests that use real local infrastructure",
    "external: tests that may call an external service",
]
filterwarnings = [
    "error::pytest.PytestUnraisableExceptionWarning",
    "error::pytest.PytestUnhandledThreadExceptionWarning",
]

[tool.coverage.run]
branch = true
source = ["src", "evaluation"]
omit = [
    "tests/*",
    ".venv/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "evaluation/results/coverage_html"

[tool.coverage.xml]
output = "evaluation/results/coverage.xml"